spring.application.name=AI-Resume-Analyzer-Backend

spring.data.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

server.port=${PORT:9095}

gemini.api.key=${GEMINI_API_KEY}
gemini.api.key.secondary=${GEMINI_API_KEY_2:${GEMINI_API_KEY}}
gemini.api.key.tertiary=${GEMINI_API_KEY_3:${GEMINI_API_KEY}}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

app.resume.upload-dir=uploads/resumes

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
